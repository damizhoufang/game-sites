<style>

.fu{width:calc(var(--u)*11);height:calc(var(--u)*11);background:linear-gradient(135deg,#dc2a22,#a3150f);border:calc(var(--u)*.5) solid var(--gold);outline:calc(var(--u)*.3) solid #a3150f;display:flex;align-items:center;justify-content:center;box-shadow:0 0 calc(var(--u)*4) rgba(255,190,80,.45);margin-bottom:calc(var(--u)*1.5);animation:sway 3.2s ease-in-out infinite}
.fu b{transform:rotate(135deg);font-size:calc(var(--u)*7.6);color:#ffd866;font-weight:900;line-height:1;text-shadow:0 0 calc(var(--u)*.6) #7a0e0a}

.keys kbd{font-family:inherit;color:#2a0d08;background:#f3c45a;border-radius:calc(var(--u)*.5);padding:0 calc(var(--u)*.8);margin:0 calc(var(--u)*.4)}
.foot{position:absolute;bottom:calc(var(--u)*2.6);font-size:calc(var(--u)*2.8);color:rgba(251,227,181,.75);letter-spacing:calc(var(--u)*.3)}
.cl{position:absolute;top:13%;bottom:13%;width:calc(var(--u)*6.4);display:flex;align-items:center;justify-content:center;background:linear-gradient(#cf2a21,#a3150f);border:calc(var(--u)*.35) solid var(--gold);writing-mode:vertical-rl;font-size:calc(var(--u)*4.4);color:#ffd866;letter-spacing:calc(var(--u)*1.3);box-shadow:0 0 calc(var(--u)*2) rgba(0,0,0,.4)}
#card{background:#120403}

#card .nm{font-size:calc(var(--u)*11);color:#fff1d0;letter-spacing:calc(var(--u)*2);text-shadow:0 0 calc(var(--u)*3) rgba(255,120,60,.5)}

#msg .small{font-size:calc(var(--u)*4.2);color:#fbe3b5;line-height:1.7;white-space:pre-line}

<script>
'use strict';
// ===== 基础：画布、输入、工具 =====
const W=384,H=224,TS=16,ROWS=14,R=3;
const FONT='"KaiTi","STKaiti","Kaiti SC","KaiTi_GB2312","楷体","BiauKai","AR PL UKai CN","Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",serif';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),wrap=$('wrap');
cv.width=W*R;cv.height=H*R;
function resize(){let s=Math.min((innerWidth-30)/W,(innerHeight-30)/H);if(s>=2)s=Math.floor(s*4)/4;s=Math.max(.5,s);
 wrap.style.width=Math.round(W*s)+'px';wrap.style.height=Math.round(H*s)+'px';wrap.style.setProperty('--u',(H*s/100).toFixed(2)+'px')}
addEventListener('resize',resize);resize();

const KEYMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'J',KeyW:'J',Space:'J',KeyK:'J',KeyZ:'J',ArrowDown:'D',KeyS:'D',
 ShiftLeft:'F',ShiftRight:'F',KeyJ:'F',KeyX:'F',Enter:'S',NumpadEnter:'S',KeyP:'P',Escape:'P',KeyM:'M'};
const keys={},hits={};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!keys[k])hits[k]=true;keys[k]=true;SND.unlock()});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=false;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const hit=k=>{if(hits[k]){hits[k]=false;return true}return false};
const clearHits=()=>{for(const k in hits)hits[k]=false};
let padPrev={};
function pollPad(){const gp=navigator.getGamepads?navigator.getGamepads()[0]:null;if(!gp)return;const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
 const st={L:gp.axes[0]<-.4||b(14),R:gp.axes[0]>.4||b(15),J:b(0),F:b(2)||b(1),S:b(9),P:b(8)};
 for(const k in st){if(st[k]&&!padPrev[k])hits[k]=true;if(st[k]!==!!padPrev[k])keys[k]=st[k]}padPrev=st}

const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),irnd=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function srand(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
function mkHi(w,h){const[c,g]=mk(Math.ceil(w*R),Math.ceil(h*R));g.imageSmoothingEnabled=true;g.scale(R,R);c.lw=w;c.lh=h;return[c,g]}
function sprite(rows,pal){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const[c,g]=mk(w,h);
 rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){g.fillStyle=col;g.fillRect(x,y,1,1)}}});return c}
const flipC=new WeakMap();
function flip(c){let f=flipC.get(c);if(!f){const[d,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);d.lw=c.lw;d.lh=c.lh;f=d;flipC.set(c,f)}return f}
function blit(img,x,y,fx,w,h){ctx.drawImage(fx?flip(img):img,x,y,w||img.lw||img.width,h||img.lh||img.height)}
function ell(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function rect(g,col,x,y,w,h){g.fillStyle=col;g.fillRect(x,y,w,h)}
function txt(s,x,y,size,col,align,stroke){ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'left';ctx.textBaseline='middle';
 if(stroke!==null){ctx.lineWidth=size*.3;ctx.strokeStyle=stroke||'#3a0806';ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
// ===== 像素角色：小羊阿咩、年兽一族、道具 =====
const GP={k:'#2b1a17',w:'#fbf7ef',g:'#d6c8b6',h:'#d9a35f',H:'#8c5a2b',e:'#1b1210',p:'#f29b97',r:'#d6281f',R:'#8e1712',y:'#f6c94c',b:'#4a3530'};
const GPF=Object.assign({},GP,{r:'#f2b630',R:'#b46f12',y:'#d6281f'});
const GOAT_HEAD=[
"................",
"....kk.kk.kk....",
"...kwwkwwkwwkk..",
"..kwwwgwwwwwwk..",
".khhkwwwwwwwwwk.",
"khHhhkwwwwwewwk.",
"khkHhkwwwwwewwkk",
"kHhhkgwwwwwwwppk",
".kkkkgwwwwwwwwk.",
"....kggwwwwwkgk."];
const GOAT_BODY=[
"...krrryyrrrkgk.",
"..krrrryyrrrrk..",
"..kwrrryyrrrwk..",
"...kkRRRRRRkk..."];
const GOAT_LEGS={stand:["....kbbk.kbbk...","....kkkk.kkkk..."],walk1:["...kbbk...kbbk..","...kkkk...kkkk.."],
 walk2:[".....kbbkbbk....",".....kkkkkkk...."],jump:["..kbbk....kbbk..","..kkk......kkk.."]};
function goatSet(pal){const o={s:{},b:{}};for(const f in GOAT_LEGS){const L=GOAT_LEGS[f];
 o.s[f]=sprite([...GOAT_HEAD,...GOAT_BODY,...L],pal);
 o.b[f]=sprite([...GOAT_HEAD,...[0,1,1,1,1,1,1,2,3].map(i=>GOAT_BODY[i]),L[0],L[0],L[0],L[0],L[1]],pal)}return o}

const sym=rows=>rows.map(r=>r+[...r].reverse().join(''));
const NIAN=[
".......y",
"......yY",
"...kkkkk",
"..kmmooo",
".kmooooo",
"kmoWWWoo",
"kmoWeWoo",
"kmoWWWoo",
"kmoooooo",
"kmookkkk",
"kmokwkRR",
"kmookkkk",
".kmooooo",
".kmmmmmm"];
const NFEET=[["..kbbk..","..kkkk.."],["...kbbk.","...kkkk."]];
const SPIKE=["...y..y.","..yY.yY.","..kkkkkk"];
const NP={k:'#2a1512',o:'#e4572e',O:'#b8361d',m:'#f7a83a',y:'#ffe27a',Y:'#e0a530',W:'#ffffff',e:'#1a0f0f',w:'#fffaf0',R:'#7a1010',b:'#3d2420'};
const HP=Object.assign({},NP,{o:'#3f8fd0',m:'#a6dcf7',O:'#255c8f'});
const KP=Object.assign({},NP,{o:'#6a3d9e',m:'#b48be0',O:'#432268',y:'#f4f4ff',Y:'#b9b9d9'});
const BP=Object.assign({},NP,{o:'#a51d18',m:'#f3c45a',O:'#6b0f0c',W:'#ffe680',e:'#c00000',y:'#fff1b0',b:'#2a0f0a'});
function beast(pal,top){const body=top?[...top,...NIAN.slice(3)]:NIAN;return NFEET.map(f=>sprite(sym([...body,...f]),pal))}

const DUMP=[
"......kkkk......",
"....kkwwwwkk....",
"...kwgwgwgwgk...",
"..kwwwwwwwwwwk..",
".kwwwwwwwwwwwwk.",
".kwwwwewwwewwwk.",
".kwwwpwwwwwpwwk.",
".kgwwwwwwwwwwgk.",
"..kggwwwwwwggk..",
"...kkkkkkkkkk..."];
const YB=[
"......kkkk......",
".....kyyyyk.....",
".kk.kyYyyyyk.kk.",
"kyyk.kyyyyk.kyyk",
"kyyykkkkkkkkyyyk",
".kyyyyyyyyyyyyk.",
"..kYyyyyyyyyyYk.",
"...kYYYYYYYYk...",
"....kkkkkkkk...."];

const SPR={};
function buildSprites(){
 SPR.goat={n:goatSet(GP),f:goatSet(GPF)};
 SPR.nian=beast(NP);SPR.hop=beast(HP);SPR.spiky=beast(KP,SPIKE);SPR.boss=beast(BP);
 SPR.dump=sprite(DUMP,{k:'#3a2a20',w:'#fffaf0',g:'#e6dccb',e:'#2a1a17',p:'#f5a0a0'});
 SPR.yb=sprite(YB,{k:'#6b3d0a',y:'#ffd54a',Y:'#d79a1e'});
 // 铜钱
 let[c,g]=mkHi(10,10);ell(g,5,5,5,5,'#7a4c0e');ell(g,5,5,4.3,4.3,'#f1c04a');ell(g,4.3,4.3,2.6,2.6,'#ffe38c');
 g.strokeStyle='#b8862a';g.lineWidth=.5;g.beginPath();g.arc(5,5,3.4,0,7);g.stroke();rect(g,'#7a4c0e',3.5,3.5,3,3);SPR.coin=c;
 // 红包
 [c,g]=mkHi(10,13);rect(g,'#7a0d0a',0,0,10,13);rect(g,'#d6281f',.5,.5,9,12);g.fillStyle='#b31a14';g.beginPath();g.moveTo(.5,.5);g.lineTo(5,5);g.lineTo(9.5,.5);g.fill();
 ell(g,5,5.2,1.8,1.8,'#f6c94c');rect(g,'#f6c94c',2,10,6,.6);SPR.hb=c;
 // 鞭炮道具
 [c,g]=mkHi(16,16);const tube=(x,y,h)=>{rect(g,'#6b0a08',x-.5,y,5,h);rect(g,'#d8261f',x,y,4,h);rect(g,'#ff7a5a',x+.7,y+.5,1,h-1);rect(g,'#f6c94c',x,y+2,4,1);rect(g,'#f6c94c',x,y+h-3,4,1);
  rect(g,'#3a2a20',x+1.6,y-1.4,.8,1.4)};tube(1.5,6,9);tube(10.5,6,9);tube(6,3.5,11.5);
 g.strokeStyle='#3a2a20';g.lineWidth=.7;g.beginPath();g.moveTo(8,2.2);g.quadraticCurveTo(9.5,0,12,1);g.stroke();SPR.crk=c;
 // 福字小旗
 [c,g]=mkHi(18,13);g.fillStyle='#f3c45a';g.beginPath();g.moveTo(18,0);g.lineTo(0,6.5);g.lineTo(18,13);g.fill();
 g.fillStyle='#cf231c';g.beginPath();g.moveTo(17.2,1.2);g.lineTo(2.4,6.5);g.lineTo(17.2,11.8);g.fill();
 g.fillStyle='#ffd866';g.font='900 6.5px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('福',12.4,6.9);SPR.flag=c;
}
// ===== 场景：主题、砖块、远景 =====
const THEMES={
 day:{sky:['#74b9de','#c2e2ef','#fbe7c6'],stone:'#a3acb2',stoneL:'#cfd6da',stoneD:'#6e787f',earth:'#8b4a2c',earth2:'#6a3520',brick:'#b8432e',brickL:'#d8664c',mortar:'#5e1d12',
  wall:'#b02a20',roof:'#e0a72e',roofD:'#9c6a14',snow:'#f7f9fc',wood:'#9b5a2e',cloud:'#fff7e6',cloudD:'#e7c46f',music:'market',snowN:28,
  house:{wall:'#efe8da',wallD:'rgba(120,100,80,.45)',roof:'#3b3f47',win:'#5a463a',snow:'#ffffff',door:'#a8261d',trunk:'#4a3226'}},
 night:{sky:['#060922','#1b1440','#4d1f45'],stone:'#5d6378',stoneL:'#8e96ad',stoneD:'#363a4c',earth:'#3a2632',earth2:'#2a1a24',brick:'#8e2f2a',brickL:'#b54a3e',mortar:'#3e1210',
  wall:'#7e1f1a',roof:'#2f6b8a',roofD:'#1b3f52',snow:'#dfe7f7',wood:'#6e4026',cloud:'#e9e3ff',cloudD:'#a99ad8',music:'night',snowN:18,
  house:{wall:'#2c2446',wallD:'rgba(8,5,20,.7)',roof:'#151026',win:'#ffc35a',snow:'#c9d2ec',door:'#6e1712',trunk:'#1c1424'}},
 boss:{sky:['#170612','#5a1a2a','#c8603c'],stone:'#7a6a6a',stoneL:'#aa9898',stoneD:'#4a3c3c',earth:'#4b2a22',earth2:'#341a14',brick:'#7e2a22',brickL:'#a2463a',mortar:'#3a0f0a',
  wall:'#6e1a14',roof:'#3a3a44',roofD:'#22222a',snow:'#f2f0f4',wood:'#5e3a26',cloud:'#f3e6e6',cloudD:'#c79a9a',music:'night',snowN:110,
  house:{wall:'#3a2230',wallD:'rgba(10,0,5,.6)',roof:'#1a0d14',win:'#ff8a4a',snow:'#e8e0e6',door:'#4a0d0a',trunk:'#1a0a0e'}}};

function makeTiles(th){
 const T={},tile=fn=>{const[c,g]=mkHi(16,16);fn(g);return c};
 T.D=tile(g=>{rect(g,th.earth,0,0,16,16);[[2,3,3],[9,5,2],[5,10,2],[12,12,3],[13,1,2],[1,13,2],[7,7,1]].forEach(([x,y,w])=>rect(g,th.earth2,x,y,w,1.5))});
 T.G=tile(g=>{g.drawImage(T.D,0,0,16,16);rect(g,th.stone,0,1,16,7);rect(g,th.stoneL,0,2,16,1);rect(g,th.stoneD,0,7.5,16,1.2);rect(g,th.stoneD,7,2.5,1,5);
  rect(g,th.snow,0,0,16,2.4);ell(g,4,2.3,3.2,1.5,th.snow);ell(g,12,2.4,2.5,1.2,th.snow)});
 T.B=tile(g=>{rect(g,th.mortar,0,0,16,16);const br=(x,y,w)=>{rect(g,th.brick,x,y,w,6.6);rect(g,th.brickL,x,y,w,1);rect(g,th.brickL,x,y,1,6.6)};
  br(.6,.6,6.8);br(8.6,.6,6.8);br(-4,8.6,7.4);br(4.6,8.6,6.8);br(12.6,8.6,3.4)});
 T.Q=[0,1,2].map(f=>tile(g=>{rect(g,'#5a0a07',0,0,16,16);rect(g,'#c8231e',.6,.6,14.8,14.8);const gold=['#f3c45a','#ffe28a','#e0a83c'][f];
  g.strokeStyle=gold;g.lineWidth=.7;g.strokeRect(1.9,1.9,12.2,12.2);[[1.2,1.2],[13.2,1.2],[1.2,13.2],[13.2,13.2]].forEach(([x,y])=>rect(g,gold,x,y,1.6,1.6));
  g.save();g.translate(8,8.3);g.rotate(Math.PI);g.fillStyle=gold;g.font='900 10px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('福',0,0);g.restore();
  if(f===1){g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(2,10);g.lineTo(10,2);g.lineTo(12,2);g.lineTo(4,10);g.fill()}}));

 if(o.vy>=0){const ty=Math.floor((o.y+o.h-.01)/TS);for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)||(oneway(tx,ty)&&pb<=ty*TS+.5)){o.y=ty*TS-o.h;o.vy=0;o.onGround=true;r.d=1;break}}
 else{const ty=Math.floor(o.y/TS);let best=-1,bd=1e9,cnt=0;for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){cnt++;const d=Math.abs((tx+.5)*TS-(o.x+o.w/2));if(d<bd){bd=d;best=tx}}
  if(best>=0){const L=best*TS;
   if(o.corner&&cnt===1&&o.x+o.w-L<=4&&!solid(best-1,ty))o.x=L-o.w;
   else if(o.corner&&cnt===1&&L+TS-o.x<=4&&!solid(best+1,ty))o.x=L+TS;
   else{o.y=(ty+1)*TS;o.vy=0;r.u={tx:best,ty}}}}
 return r}

function newPlayer(tx,pw){const big=pw>0;return{x:tx*TS+2,y:12*TS-(big?23:15),w:12,h:big?23:15,vx:0,vy:0,face:1,big,fire:pw>1,inv:0,anim:0,onGround:false,jb:0,co:0,dead:false,st:'play',combo:0,corner:true}}

function updPlayer(){const p=P,run=keys.F||keys.T,dir=(keys.R?1:0)-(keys.L?1:0),max=run?2.7:1.6;
 if(dir){p.face=dir;if(p.vx*dir<0&&p.onGround){p.vx+=dir*.2;p.skid=true}else{p.skid=false;if(Math.abs(p.vx)<max||p.vx*dir<0)p.vx+=dir*(p.onGround?(run?.11:.08):.07);
  if(Math.abs(p.vx)>max)p.vx=Math.sign(p.vx)*Math.max(max,Math.abs(p.vx)-.06)}}
 else{p.skid=false;if(p.onGround)p.vx=Math.abs(p.vx)<=.1?0:p.vx-Math.sign(p.vx)*.1}
 if(hit('J'))p.jb=7;else if(p.jb>0)p.jb--;
 if(p.onGround){p.co=6;p.combo=0}else if(p.co>0)p.co--;
 if(p.jb>0&&p.co>0){p.vy=-(5.1+Math.abs(p.vx)*.22);p.jb=0;p.co=0;SND.sfx('jump')}
 p.vy=Math.min(p.vy+(p.vy<0&&keys.J?.19:.42),6.5);
 const r=move(p);if(r.l||r.r)p.vx=0;if(r.u)bump(r.u.tx,r.u.ty);

 if(p.fire&&hit('F')&&shots.length<2){shots.push({x:p.x+(p.face>0?p.w:-6),y:p.y+6,w:6,h:6,vx:3.8*p.face,vy:1.5,t:0});SND.sfx('throw')}
 if(p.inv>0)p.inv--;p.anim+=p.onGround?Math.abs(p.vx)*.16:0;
 if(p.y>H+24)killPlayer(true)}

function bump(tx,ty){const c=lvl.t[ty][tx],key=tx+','+ty,it=lvl.items[key];
 if(c==='Q'||(c==='B'&&it)){
  if(it==='C'){lvl.multi[key]=(lvl.multi[key]||0)+1;coinPop(tx,ty);if(lvl.multi[key]>=8){lvl.t[ty][tx]='U';delete lvl.items[key]}}
  else{lvl.t[ty][tx]='U';delete lvl.items[key];if(it==='c')coinPop(tx,ty);else spawnItem(it,tx,ty)}
  bumpTile(tx,ty)}
 else if(c==='B'){if(P.big){lvl.t[ty][tx]=0;SND.sfx('break');addScore(50);hitAbove(tx,ty);
   for(let i=0;i<4;i++)parts.push({x:tx*TS+4+(i%2)*8,y:ty*TS+4+(i>>1)*8,vx:i%2?1.3:-1.3,vy:i>>1?-3.5:-5.2,g:.3,l:90,k:'brick'})}else bumpTile(tx,ty)}
 else SND.sfx('bump')}
function bumpTile(tx,ty){lvl.bump[tx+','+ty]=10;SND.sfx('bump');hitAbove(tx,ty)}
function hitAbove(tx,ty){const L=tx*TS,top=ty*TS;
 for(const e of ents){if(!e.alive||e.fl||e.sq)continue;if(e.k==='coin'){if(e.x<L+TS&&e.x+e.w>L&&e.y<top&&e.y>top-TS){e.alive=false;addCoin();sparkle(e.x+5,e.y+5)}continue}
  if(e.k!=='boss'&&e.k!=='fire'&&Math.abs(e.y+e.h-top)<3&&e.x+e.w>L&&e.x<L+TS){killEnemy(e,e.x+e.w/2<L+8?-1:1);addScore(200,e.x,e.y)}}
 for(const it of items)if(!it.em&&Math.abs(it.y+it.h-top)<3&&it.x+it.w>L&&it.x<L+TS)it.vy=-4}
function coinPop(tx,ty){addCoin();addScore(200);parts.push({k:'hb',x:tx*TS+3,y:ty*TS-13,vx:0,vy:-4.6,g:.32,l:28})}
function spawnItem(it,tx,ty){const k=it==='1'?'yb':(it==='m'&&P.big)?'crk':'dump',h=k==='crk'?16:k==='yb'?9:10;

function updItems(){for(const it of items){if(it.em){it.y-=.5;if(it.y+it.h<=it.top){it.em=false;it.vx=it.k==='crk'?0:1.1}continue}
  if(it.k!=='crk'){it.vy=Math.min(it.vy+.35,6);const r=move(it);if(r.l||r.r)it.vx=-it.vx}
  if(!P.dead&&overlap(P,it)){it.dead=1;
   if(it.k==='dump'){addScore(1000,it.x,it.y);if(!P.big)grow();SND.sfx('power');popup('饺子',it.x,it.y-10,'#ffe7c0')}
   else if(it.k==='crk'){addScore(1000,it.x,it.y);if(!P.big)grow();P.fire=true;SND.sfx('power');SND.sfx('crackle');popup('鞭炮',it.x,it.y-10,'#ffd866')}
   else{G.lives++;SND.sfx('1up');popup('+1命',it.x,it.y-10,'#ffd866')}}
  if(it.y>H+20||it.x<cam.x-40)it.dead=1}items=items.filter(i=>!i.dead)}

function makeEnt(d){if(d.k==='coin')return{k:'coin',x:d.x*TS+3,y:d.y*TS+3,w:10,h:10,alive:true};
 return{k:d.k,x:d.x*TS+1,y:(d.y+1)*TS-14,w:14,h:14,vx:d.k==='spiky'?-.4:-.5,vy:0,alive:true,act:false,t:irnd(0,60),sq:0,fl:false,corner:false}}

function stomp(e){e.sq=30;P.vy=keys.J?-5.8:-3.9;P.combo++;const sc=[100,200,400,800,1000,2000,4000,8000][Math.min(P.combo-1,7)];addScore(sc,e.x,e.y-6);SND.sfx('stomp');

function updEnts(){for(const e of ents){if(!e.alive)continue;
  if(e.k==='coin'){if(!P.dead&&overlap(P,e)){e.alive=false;addCoin();sparkle(e.x+5,e.y+5)}continue}
  if(!e.act){if(e.x<cam.x+W+24)e.act=true;else continue}
  if(e.sq){if(--e.sq<=0)e.alive=false;continue}
  if(e.fl){e.vy+=.3;e.x+=e.vx;e.y+=e.vy;if(e.y>H+60)e.alive=false;continue}
  if(e.k==='boss'){updBoss(e);continue}
  if(e.k==='fire'){e.t++;e.vy=Math.min(e.vy+.15,5);const r=move(e);if(r.d)e.vy=-3.4;if(r.l||r.r||e.t>320)e.alive=false;
   if(!P.dead&&overlap(P,e))hurt();continue}
  e.t++;e.vy=Math.min(e.vy+.3,6);if(e.k==='hop'&&e.onGround&&e.t%80===0)e.vy=-4.6;
  const r=move(e);if(r.l||r.r)e.vx=-e.vx;
  if(e.y>H+30||e.x<cam.x-96){e.alive=false;continue}
  if(!P.dead&&P.st==='play'&&overlap(P,e)){if(e.k!=='spiky'&&P.vy>0&&P.y+P.h-e.y<Math.max(7,P.vy+4))stomp(e);else hurt()}}
 const w=ents.filter(e=>e.alive&&e.act&&!e.fl&&!e.sq&&(e.k==='nian'||e.k==='hop'||e.k==='spiky'));
 for(let i=0;i<w.length;i++)for(let j=i+1;j<w.length;j++){const a=w[i],b=w[j];if(overlap(a,b)&&(a.x<b.x?a.vx>0||b.vx<0:a.vx<0||b.vx>0)){a.vx=-a.vx;b.vx=-b.vx}}
 ents=ents.filter(e=>e.alive)}

function spawnBoss(){boss={k:'boss',x:(lvl.arena+18)*TS,y:12*TS-44,w:40,h:44,vx:0,vy:0,alive:true,act:true,hp:6,max:6,t:-100,inv:0,dir:-1,spd:.7,corner:false,fl:false,sq:0,air:false};
 ents.push(boss);SND.stop();SND.sfx('roar');G.shake=50;setTimeout(()=>SND.play('boss'),900)}
function updBoss(e){e.t++;if(e.inv>0)e.inv--;e.vy=Math.min(e.vy+.35,7);
 if(e.t>0){if(e.onGround){e.vx=e.dir*e.spd;if(e.air){G.shake=14;SND.sfx('stomp')}}
  if(e.t%60===0&&e.onGround)e.dir=P.x<e.x?-1:1;
  if(e.t%130===0&&e.onGround){if(Math.random()<.5){e.vy=-7.6;e.vx=e.dir*1.6}
   else{for(let i=0;i<3;i++)ents.push({k:'fire',x:e.x+e.w/2-4,y:e.y+14,w:8,h:8,vx:(P.x<e.x?-1:1)*(1+i*.7),vy:-3-i*.7,alive:true,act:true,t:0,corner:false});SND.sfx('throw')}}}else e.vx=0;
 e.air=!e.onGround;const r=move(e);if(r.l||r.r)e.dir=-e.dir;const L=lvl.arena*TS;if(e.x<L){e.x=L;e.dir=1}
 if(!P.dead&&overlap(P,e)){if(P.vy>0&&P.y+P.h-e.y<14){P.vy=keys.J?-6.4:-5;if(e.inv<=0){e.hp--;e.inv=60;e.spd+=.2;SND.sfx('gong');G.shake=10;sparkle(e.x+20,e.y+6,16);if(e.hp<=0)bossDie(e)}}
  else if(e.inv<40)hurt()}}
function bossDie(e){e.fl=true;e.vy=-5;e.vx=.6;G.bossDead=true;G.winT=0;SND.stop();SND.sfx('crackle');addScore(5000,e.x+10,e.y);
 for(const x of ents)if(x.k==='fire')x.alive=false}

function updShots(){for(const s of shots){s.t++;s.vy=Math.min(s.vy+.35,6);const r=move(s);if(r.d)s.vy=-3.2;
  if(r.l||r.r){s.dead=1;explode(s)}else if(s.t>150||s.x<cam.x-16||s.x>cam.x+W+16)s.dead=1;
  if(!s.dead)for(const e of ents){if(!e.alive||e.k==='coin'||e.fl||e.sq||e.k==='fire'||!e.act)continue;if(overlap(s,e)){s.dead=1;explode(s);
   if(e.k==='boss'){if(e.inv<=0){e.hp-=.5;e.inv=12;SND.sfx('gong');if(e.hp<=0)bossDie(e)}}else{killEnemy(e,Math.sign(s.vx));addScore(200,e.x,e.y)}break}}}

 for(const q of pops){q.y-=.5;q.l--}pops=pops.filter(q=>q.l>0);for(const k in lvl.bump)if(--lvl.bump[k]<=0)delete lvl.bump[k]}
// ===== 游戏流程、绘制、界面 =====
const G={mode:'title',li:0,score:0,coins:0,lives:3,pw:0,time:0,tf:0,tick:0,check:false,freeze:0,growing:false,shake:0,flagY:0,doorX:0,ct:0,bossDead:false,winT:0,theme:'day'};

function loadLevel(i){const def=LEVELS[i];lvl=buildLevel(def);lvl.bump={};useTheme(def.theme);

function update(){pollPad();G.tick++;if(hit('M'))SND.toggle();if(G.shake>0)G.shake--;
 switch(G.mode){
  case'title':cam.x+=.45;if(cam.x>lvl.w*TS-W)cam.x=0;fwUpdate();if(hit('S')||hit('J'))startGame();break;
  case'card':if(--G.cardT<=0||hit('S'))beginPlay();break;

  case'pause':if(hit('P')||hit('S')){G.mode='play';hide('msg');SND.pause(false)}break;

function updPlay(){fwUpdate();if(G.theme==='night'&&Math.random()<.012)fwLaunch(undefined,undefined,true);
 if(G.freeze>0){if(--G.freeze===0)G.growing=false;return}
 if(P.dead){P.dt++;if(P.dt===40&&!P.pit)P.vy=-6.5;if(P.dt>40){P.vy+=.3;P.y+=P.vy}updParts();

 updPlayer();if(P.dead)return;

 if(P.x>LEVELS[G.li].check*TS)G.check=true;

function drawTiles(){const x0=Math.max(0,Math.floor(cam.x/TS)-1),x1=Math.min(lvl.w-1,x0+W/TS+2),qf=[0,0,1,2][(G.tick>>4)&3];
 for(let y=0;y<ROWS;y++){const row=lvl.t[y];for(let x=x0;x<=x1;x++){const c=row[x];if(!c)continue;const b=lvl.bump[x+','+y],oy=b?Math.sin((10-b)/10*Math.PI)*4:0;
  ctx.drawImage(c==='Q'?tiles.Q[qf]:tiles[c],x*TS,y*TS-oy,TS,TS)}}}

 if(e.k==='boss'){if(e.inv>0&&(G.tick>>2)&1)return;ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h+(e.fl?-24:0));if(e.fl)ctx.scale(1,-1);ctx.drawImage(SPR.boss[e.t>0&&!e.onGround?0:fr],-24,e.fl?-24:-48,48,48);ctx.restore();return}

 ctx.drawImage(img,e.x-1,e.y+e.h-16,16,16)}
