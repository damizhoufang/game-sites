<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小羊闯年关 · 选择版本</title>
<meta name="description" content="春节主题横版闯关小游戏：小羊阿咩顶福砖、踩年兽。有电脑版和手机版。">
<meta name="theme-color" content="#1a0705">
<link rel="icon" type="image/png" href="mobile/icon-192.png">
<link rel="apple-touch-icon" href="mobile/icon-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"KaiTi","STKaiti","Kaiti SC","楷体","Noto Serif CJK SC","Songti SC",serif;color:#fbf1dc;background:#1a0705 radial-gradient(ellipse at 50% 30%,#5a1712 0%,#260a07 55%,#120403 100%) fixed;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 40px)}
header{text-align:center}
.fu{width:64px;height:64px;margin:0 auto 22px;rotate:45deg;background:linear-gradient(135deg,#dc2a22,#a3150f);border:3px solid #f3c45a;box-shadow:0 0 26px rgba(255,190,80,.45);display:grid;place-items:center;animation:sway 3.2s ease-in-out infinite}
.fu i{rotate:135deg;font-size:40px;font-weight:900;line-height:1;font-style:normal;color:#ffd866}
@keyframes sway{0%,100%{rotate:41deg}50%{rotate:49deg}}
h1{font-size:clamp(46px,12vw,84px);font-weight:900;letter-spacing:.12em;color:#ffd866;line-height:1.1;text-shadow:0 4px 0 #8e140f,0 8px 0 #5a0a07,0 0 26px rgba(255,170,60,.55);text-wrap:balance}
.tag{margin-top:16px;font-size:18px;letter-spacing:.4em;color:#fbe3b5}
main{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:100%;max-width:760px}
a.card{flex:1 1 280px;display:flex;flex-direction:column;text-decoration:none;color:inherit;padding:24px;border-radius:10px;background:linear-gradient(170deg,#5e1510,#2c0806);border:2px solid #9b1b15;outline:1px solid rgba(243,196,90,.45);outline-offset:-7px;box-shadow:0 18px 44px rgba(0,0,0,.5);transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:#f3c45a}
a.card:focus-visible{outline:3px solid #ffd866;outline-offset:3px}
a.card.rec{border-color:#f3c45a}
.card h2{font-size:30px;color:#ffd866;display:flex;align-items:center;gap:12px}
.card h2 em{display:none;font:700 13px/1 system-ui,sans-serif;font-style:normal;letter-spacing:.05em;color:#5a0a07;background:#f3c45a;padding:6px 9px;border-radius:4px}
.card.rec h2 em{display:inline-block}
.card ul{list-style:none;margin:14px 0 20px;font-size:16px;line-height:2;color:#f6dcb0;flex:1}
.card li::before{content:"";display:inline-block;width:7px;height:7px;rotate:45deg;background:#e8392b;margin-right:10px;vertical-align:middle}
.go{display:block;text-align:center;font-size:20px;font-weight:900;letter-spacing:.2em;color:#5a0a07;padding:13px;border-radius:6px;background:linear-gradient(180deg,#ffe28a,#f3c45a 50%,#d39a22);box-shadow:0 4px 0 #7a4a08}
footer{max-width:600px;text-align:center;font-size:14px;line-height:1.9;color:rgba(251,227,181,.7)}
@media (prefers-reduced-motion:reduce){.fu{animation:none}a.card{transition:none}}
</style>
</head>
<body>
<header>
  <div class="fu" aria-hidden="true"><i>福</i></div>
  <h1>小羊闯年关</h1>
  <p class="tag">羊年大吉 · 新春版</p>
</header>
<main>
  <a class="card" id="c-pc" href="pc/">
    <h2>电脑版 <em>推荐你的设备</em></h2>
    <ul><li>方向键移动，空格跳跃</li><li>Shift 奔跑、扔鞭炮</li><li>也支持游戏手柄</li></ul>
    <span class="go">进入电脑版</span>
  </a>
  <a class="card" id="c-m" href="mobile/">
    <h2>手机版 <em>推荐你的设备</em></h2>
    <ul><li>屏幕上有触屏手柄，竖屏横屏都能玩</li><li>方向键推到底就奔跑</li><li>可添加到主屏幕，断网也能玩</li></ul>
    <span class="go">进入手机版</span>
  </a>
</main>
<footer>三关：腊月集市、除夕之夜、决战年兽。<br>iPhone 请用 Safari 打开手机版，点「分享」→「添加到主屏幕」。</footer>
<script>
(function () {
  var touch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && Math.min(screen.width, screen.height) < 820;
  var rec = document.getElementById(touch ? 'c-m' : 'c-pc');
  rec.className += ' rec';
  rec.parentNode.insertBefore(rec, rec.parentNode.firstChild);
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { if (/\/xiaoyang\/$/.test(r.scope)) r.update().catch(function () {}); });
  }).catch(function () {});
})();
</script>
</body>
</html>
